<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOTAM</title>
<style>
:root{
  --paper:#f1f3ef; --card:#fbfcfa; --ink:#14213d; --muted:#5d6879; --line:#d3d9d2;
  --active:#b0237a; --soon:#2f6f9f; --ok:#3b7d5c; --chip:#e3e8e1;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#101722; --card:#172131; --ink:#e7ecf4; --muted:#93a1b6; --line:#2a374b;
         --active:#ee74bd; --soon:#6fb2e3; --ok:#7bc4a0; --chip:#223049; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:860px;margin:0 auto}
h1{font-size:1.9rem;letter-spacing:-.01em;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
textarea{min-height:110px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1 1 160px}
button{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--active);outline-offset:2px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:3px 10px;font-size:.85rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chip{background:var(--chip);border:1px solid transparent;color:var(--ink);padding:4px 11px;border-radius:99px;font-size:.88rem;font-weight:500}
.chip[aria-pressed=false]{background:transparent;border-color:var(--line);color:var(--muted);text-decoration:line-through}
.status{color:var(--muted);margin:12px 2px;min-height:1.4em}
.err{color:var(--active);font-weight:600}
h2{font-size:1.15rem;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--muted);font-weight:400;font-size:.85rem}
.n{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--soon);border-radius:8px;margin-bottom:8px}
.n.active{border-left-color:var(--active)}
.n.perm{border-left-color:var(--muted)}
.n summary{list-style:none;cursor:pointer;padding:10px 12px}
.n summary::-webkit-details-marker{display:none}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cat{font-weight:700;font-size:.9rem}
.n.active .cat{color:var(--active)}
.id{color:var(--muted);font-size:.85rem}
.when{margin-left:auto;font-size:.88rem;color:var(--muted);text-align:right}
.txt{margin:4px 0 0}
.raw{margin:0;padding:10px 12px;border-top:1px dashed var(--line);font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.empty{padding:26px 12px;text-align:center;color:var(--muted)}
details.set summary{cursor:pointer;color:var(--muted)}
details.set{margin-top:12px}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<main>
  <h1>NOTAM</h1>
  <p class="sub">Aktuelle Luftfahrtmitteilungen für deine Flugplätze und Gebiete.</p>

  <section class="panel">
    <div class="row">
      <div>
        <label for="src">Quelle</label>
        <select id="src">
          <option value="dfs" selected>DFS-PIB (amtlich)</option>
          <option value="faa">FAA-Suche (inoffiziell)</option>
        </select>
      </div>
      <div style="flex:2 1 260px">
        <label for="loc" id="loclabel">Flugplätze oder FIR</label>
        <input id="loc" type="text" placeholder="z. B. EDDS, EDTY, EDGG" autocapitalize="characters" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="range">Zeitraum</label>
        <select id="range">
          <option value="24">Aktiv + nächste 24 h</option>
          <option value="168" selected>Aktiv + nächste 7 Tage</option>
          <option value="720">Aktiv + nächste 30 Tage</option>
          <option value="now">Nur jetzt aktiv</option>
        </select>
      </div>
      <button id="go">Laden</button>
    </div>
    <div class="quick" id="quick"></div>

    <details class="set">
      <summary>Einstellungen und manuelle Eingabe</summary>
      <div style="margin-top:10px">
        <label for="pibUrl">PIB-Worker (Adresse, ohne / am Ende)</label>
        <input id="pibUrl" type="text" placeholder="https://notam-pib.…workers.dev" autocomplete="off" spellcheck="false">
        <label for="pibToken" style="margin-top:8px">PIB-Worker Token</label>
        <input id="pibToken" type="password" autocomplete="off">
      </div>
      <div style="margin-top:12px">
        <label for="proxy">Proxy-Adresse (Cloudflare-Worker)</label>
        <input id="proxy" type="text" autocomplete="off" spellcheck="false">
        <p class="hint">Der Worker muss für notams.aim.faa.gov POST-Anfragen weiterreichen.</p>
      </div>
      <div style="margin-top:12px">
        <label for="paste">NOTAM-Text einfügen (z. B. aus dem DFS-Portal oder einer PIB)</label>
        <textarea id="paste" placeholder="A1234/26 NOTAMN&#10;Q) EDGG/QWPLW/..."></textarea>
        <div style="margin-top:8px"><button class="ghost" id="parse">Text auswerten</button></div>
      </div>
    </details>
  </section>

  <div class="chips" id="chips" aria-label="Kategorien"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>
</main>

<script>
const DEFAULT_PROXY = "https://flugwetter.c8c58p6hpv.workers.dev/?url=";
const FAA = "https://notams.aim.faa.gov/notamSearch/search";
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};

const CATS = ["Luftraum","Aktivität","Hindernis","Piste & Rollweg","Flugplatz","Navigation","Sonstige"];
const hidden = new Set(JSON.parse(store.get("notam.hidden","[]")));
let all = [];

function catOf(q){
  const c = (q||"").split("/")[1] || "";
  const L = c[1];
  if (!L) return "Sonstige";
  if ("RA".includes(L)) return "Luftraum";
  if (L==="W") return "Aktivität";
  if (L==="O") return "Hindernis";
  if (L==="M") return "Piste & Rollweg";
  if ("FLS".includes(L)) return "Flugplatz";
  if ("NCIP".includes(L)) return "Navigation";
  return "Sonstige";
}

function parseDate(s){
  if (!s || !/^\d{10}$/.test(s)) return null;
  return Date.UTC(2000+ +s.slice(0,2), +s.slice(2,4)-1, +s.slice(4,6), +s.slice(6,8), +s.slice(8,10));
}

function parseNotam(msg, fallbackLoc){
  msg = (msg||"").trim();
  if (!msg) return null;
  const id = (msg.match(/([A-Z]\d{4}\/\d{2})/)||[])[1] || "";
  const q  = (msg.match(/Q\)\s*([^\n]+)/)||[])[1] || "";
  const a  = (msg.match(/A\)\s*([A-Z]{4})/)||[])[1] || fallbackLoc || "";
  const b  = (msg.match(/B\)\s*(\d{10})/)||[])[1];
  const cm = (msg.match(/C\)\s*(\d{10}|PERM)/)||[])[1];
  let e = (msg.match(/E\)\s*([\s\S]*?)(?=\s+[FG]\)|\s+CREATED:|\s+SOURCE:|\)?\s*$)/)||[])[1] || msg;
  e = e.replace(/\s+/g," ").trim();
  return { id, q, loc:a, start:parseDate(b), end: cm==="PERM" ? Infinity : parseDate(cm),
           text:e, raw:msg, cat:catOf(q) };
}

const fmt = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Berlin"});
const fmtUtc = new Intl.DateTimeFormat("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
function when(n){
  const s = n.start ? fmt.format(n.start) : "?";
  const e = n.end===Infinity ? "unbefristet" : n.end ? fmt.format(n.end) : "?";
  return `${s} bis ${e}`;
}

async function fetchLoc(loc, proxy){
  const body = new URLSearchParams({
    searchType:"0", designatorsForLocation:loc, formatType:"ICAO",
    notamsOnly:"false", offset:"0", radius:"10"
  }).toString();
  const r = await fetch(proxy + encodeURIComponent(FAA), {
    method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body
  });
  if (!r.ok) throw new Error(`${loc}: Antwort ${r.status}`);
  const j = await r.json();
  return (j.notamList||[]).map(x => parseNotam(x.icaoMessage || x.traditionalMessage, loc)).filter(Boolean);
}

let meta = "";

async function loadPib(){
  const base = $("pibUrl").value.trim().replace(/\/+$/,""), token = $("pibToken").value;
  store.set("notam.pibUrl", base); store.set("notam.pibToken", token);
  if (!base || !token){ $("status").innerHTML = '<span class="err">Bitte unter „Einstellungen“ Adresse und Token des PIB-Workers eintragen.</span>'; return; }
  $("status").textContent = "Lade PIB …"; $("go").disabled = true;
  try {
    const r = await fetch(base + "/latest", { headers:{ Authorization:"Bearer " + token } });
    if (r.status === 401) throw new Error("Token wird vom Worker nicht akzeptiert");
    if (!r.ok) throw new Error("Antwort " + r.status);
    const j = await r.json();
    if (j.empty){ all = []; meta = ""; render(["Noch kein PIB eingegangen"], true); return; }
    const rec = new Date(j.received), ageH = (Date.now() - rec) / 3600e3;
    const blocks = j.text.split(/(?=(?:^|\n)\s*\(?[A-Z]\d{4}\/\d{2}\s+NOTAM[NRC])/);
    all = blocks.map(b => parseNotam(b)).filter(n => n && n.id).map(n => ({...n, query:n.loc || "ohne Ort"}));
    meta = `PIB eingegangen am ${fmt.format(rec)} Uhr (${ageH < 1 ? "vor " + Math.round(ageH*60) + " Min." : "vor " + ageH.toFixed(1).replace(".",",") + " Std."}).` +
           (ageH > 3 ? " Älter als 3 Stunden: vor dem Flug ein aktuelles PIB anfordern." : "");
    render([], true);
  } catch(e){
    all = []; meta = "";
    $("out").innerHTML = "";
    $("status").innerHTML = `<span class="err">PIB konnte nicht geladen werden: ${e.message}.</span>`;
  } finally { $("go").disabled = false; }
}

function setSrc(){
  const dfs = $("src").value === "dfs";
  $("loclabel").textContent = dfs ? "Nur diese Flugplätze oder FIR anzeigen (leer = alles aus dem PIB)" : "Flugplätze oder FIR (ICAO, mit Komma oder Leerzeichen getrennt)";
  store.set("notam.src", $("src").value);
}

async function load(){
  if ($("src").value === "dfs") return loadPib();
  meta = "";
  const locs = [...new Set($("loc").value.toUpperCase().split(/[\s,;]+/).filter(x=>/^[A-Z]{4}$/.test(x)))];
  if (!locs.length){ $("status").innerHTML = '<span class="err">Bitte mindestens einen vierstelligen ICAO-Code eingeben.</span>'; return; }
  store.set("notam.loc", locs.join(" "));
  const proxy = $("proxy").value.trim() || DEFAULT_PROXY;
  store.set("notam.proxy", proxy);
  $("status").textContent = "Lade NOTAMs …"; $("go").disabled = true;
  const res = await Promise.allSettled(locs.map(l => fetchLoc(l, proxy)));
  const errs = [], items = [];
  res.forEach((r,i)=> r.status==="fulfilled" ? items.push(...r.value.map(n=>({...n, query:locs[i]}))) : errs.push(r.reason.message || String(r.reason)));
  all = items;
  $("go").disabled = false;
  render(errs, true);
}

function render(errs=[], fresh=false){
  const range = $("range").value, now = Date.now();
  const maxT = range==="now" ? now : now + (+range)*3600e3;
  const seen = new Set();
  const flt = $("src").value === "dfs" ? $("loc").value.toUpperCase().split(/[\s,;]+/).filter(Boolean) : [];
  let list = all.filter(n => {
    const key = (n.id||n.raw) + "|" + n.query; if (seen.has(key)) return false; seen.add(key);
    if (flt.length && !flt.includes(n.loc)) return false;
    if (n.end && n.end < now) return false;
    if (n.start && n.start > maxT) return false;
    return !hidden.has(n.cat);
  });
  const t = ($("out").dataset.q||"");
  list.sort((a,b)=> ((b.start<=now)-(a.start<=now)) || (a.end-b.end || 0));

  // chips
  const present = CATS.filter(c => all.some(n=>n.cat===c));
  $("chips").innerHTML = "";
  present.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c; b.setAttribute("aria-pressed", String(!hidden.has(c)));
    b.onclick = () => { hidden.has(c) ? hidden.delete(c) : hidden.add(c); store.set("notam.hidden", JSON.stringify([...hidden])); render(); };
    $("chips").append(b);
  });

  const groups = {};
  list.forEach(n => (groups[n.query||n.loc] ||= []).push(n));
  const out = $("out"); out.innerHTML = "";
  Object.keys(groups).forEach(g => {
    const h = document.createElement("h2");
    h.innerHTML = `<span>${g}</span><small>${groups[g].length} Meldung${groups[g].length===1?"":"en"}</small>`;
    out.append(h);
    groups[g].forEach(n => {
      const active = n.start <= now;
      const d = document.createElement("details");
      d.className = "n" + (active ? " active" : "") + (n.end===Infinity ? " perm" : "");
      const s = document.createElement("summary");
      s.innerHTML = `<div class="top"><span class="cat"></span><span class="id"></span><span class="when"></span></div><p class="txt"></p>`;
      s.querySelector(".cat").textContent = (active ? "Aktiv · " : "Ab ") + (active ? "" : fmt.format(n.start) + " · ") + n.cat;
      s.querySelector(".id").textContent = n.id;
      s.querySelector(".when").textContent = when(n);
      s.querySelector(".txt").textContent = n.text.length > 260 ? n.text.slice(0,260) + " …" : n.text;
      const pre = document.createElement("pre"); pre.className = "raw"; pre.textContent = n.raw +
        (n.start ? `\n\nGültig (UTC): ${fmtUtc.format(n.start)} bis ${n.end===Infinity?"unbefristet":fmtUtc.format(n.end)}` : "");
      d.append(s, pre); out.append(d);
    });
  });
  if (!list.length && (all.length || fresh)) out.innerHTML = '<div class="empty">Keine NOTAMs im gewählten Zeitraum und in den gewählten Kategorien.</div>';
  const base = all.length ? `${list.length} von ${new Set(all.map(n=>(n.id||n.raw)+n.query)).size} NOTAMs angezeigt. Stand ${fmt.format(Date.now())} Uhr. Zeiten in deutscher Ortszeit.` : "";
  const info = meta ? meta + " " : "";
  $("status").innerHTML = (errs.length ? `<span class="err">${errs.join(" · ")}.${$("src").value==="faa" ? " Ist der Proxy für POST und notams.aim.faa.gov freigegeben?" : ""}</span><br>` : "") + info + base;
}

$("go").onclick = load;
$("loc").addEventListener("keydown", e => { if (e.key==="Enter") load(); });
$("range").onchange = () => render();
$("parse").onclick = () => {
  const txt = $("paste").value;
  const parts = txt.split(/(?=(?:^|\n)\s*\(?[A-Z]\d{4}\/\d{2}\s+NOTAM[NRC])/).map(p=>parseNotam(p)).filter(n=>n && n.id);
  all = parts.map(n => ({...n, query:n.loc||"Manuell"}));
  render([], true);
};

// Startwerte
$("proxy").value = store.get("notam.proxy", DEFAULT_PROXY);
$("loc").value = store.get("notam.loc", "");
$("src").value = store.get("notam.src", "dfs");
$("pibUrl").value = store.get("notam.pibUrl", "");
$("pibToken").value = store.get("notam.pibToken", "");
setSrc();
$("src").onchange = () => { setSrc(); all = []; meta = ""; $("out").innerHTML = ""; $("chips").innerHTML = ""; $("status").textContent = ""; };
["EDGG","EDMM","EDWW"].forEach(f => {
  const b = document.createElement("button"); b.className = "ghost"; b.textContent = "+ " + f;
  b.onclick = () => { const v = $("loc").value.trim(); if (!v.split(/[\s,]+/).includes(f)) $("loc").value = (v ? v + " " : "") + f; };
  $("quick").append(b);
});
if ($("src").value === "dfs" ? ($("pibUrl").value && $("pibToken").value) : $("loc").value) load();
</script>
</body>
</html>
